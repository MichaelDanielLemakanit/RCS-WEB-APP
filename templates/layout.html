<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/index.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.8/css/dataTables.bootstrap5.css">

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.8/js/dataTables.bootstrap5.js"></script>

    <title>{% block title %}{% endblock %}</title>
</head>

<body>
    <div>
        <nav class="navbar navbar-expand-lg text-bg-dark ttom border-body" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('home') }}">RIRUTA CENTRAL SCHOOL
                    <p class="fs-6 text-success mb-0">Excellence • Integrity • Service</p>
                </a>

                <ul class="navbar-nav me-auto mb-2 mb-lg-0 p-4">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('school_life') }}">School Life</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('enrol') }}">Enrol</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for('careers') }}">Careers</a>
                    </li>
                </ul>

                <a class="btn btn-outline-success" href="{{ url_for('login') }}">Login</a>
            </div>
        </nav>
    </div>
    
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer text-center py-3 border-top mt-auto">
        <p class="mb-0">&copy; 2026 michaellemakanit</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>
</html>
